name: Convert WordPress Export to Hugo

on:
  workflow_dispatch:
    inputs:
      xml_path:
        description: "Path to WordPress export XML (in this repo)"
        required: true
        default: "migration/wordpress-export.xml"
        type: string
      output_root:
        description: "Hugo content output directory"
        required: true
        default: "content"
        type: string
      include_pages:
        description: "Include WordPress pages"
        required: true
        default: true
        type: boolean
      include_drafts:
        description: "Include draft/private/future items as draft=true"
        required: true
        default: false
        type: boolean
      create_pull_request:
        description: "Create a PR with converted content"
        required: true
        default: true
        type: boolean

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install converter dependencies
        run: python -m pip install --upgrade pip markdownify

      - name: Convert WordPress export
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --xml "${{ inputs.xml_path }}"
            --output "${{ inputs.output_root }}"
            --overwrite
          )
          if [[ "${{ inputs.include_pages }}" == "true" ]]; then
            args+=(--include-pages)
          fi
          if [[ "${{ inputs.include_drafts }}" == "true" ]]; then
            args+=(--include-drafts)
          fi
          python scripts/wp_export_to_hugo.py "${args[@]}"

      - name: Upload converted content artifact
        uses: actions/upload-artifact@v4
        with:
          name: hugo-converted-content
          path: ${{ inputs.output_root }}

      - name: Create pull request with converted content
        if: ${{ inputs.create_pull_request }}
        uses: peter-evans/create-pull-request@v7
        with:
          branch: migration/wordpress-import-${{ github.run_id }}
          commit-message: "chore(migration): import WordPress export into Hugo content"
          title: "chore(migration): import WordPress export into Hugo content"
          body: |
            Generated by workflow `${{ github.workflow }}`.
            Source XML: `${{ inputs.xml_path }}`
            Output root: `${{ inputs.output_root }}`
            Include pages: `${{ inputs.include_pages }}`
            Include drafts: `${{ inputs.include_drafts }}`

