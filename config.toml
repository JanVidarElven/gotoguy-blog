baseURL = "https://gotoguy.blog/"
theme = "LoveIt"
title = "GoToGuy Blog"
defaultContentLanguage = "en"
languageCode = "en-us"
languageName = "English"
hasCJKLanguage = false
paginate = 10
enableRobotsTXT = true
enableGitInfo = true
enableEmoji = true
timeout = "300s"

[author]
  name = "Jan Vidar Elven"
  link = "https://gotoguy.blog/"

[permalinks]
  posts = "/:year/:month/:day/:slug/"

[menu]
  [[menu.main]]
    weight = 1
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
  [[menu.main]]
    weight = 2
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
  [[menu.main]]
    weight = 3
    identifier = "categories"
    name = "Categories"
    url = "/categories/"
  [[menu.main]]
    weight = 4
    identifier = "about"
    name = "About"
    url = "/about/"
  [[menu.main]]
    weight = 5
    identifier = "speaking"
    name = "Speaking"
    url = "/speaking/"
  [[menu.main]]
    weight = 6
    identifier = "privacy"
    name = "Privacy"
    url = "/privacy/"

[params]
  defaultTheme = "auto"
  gitRepo = "https://github.com/JanVidarElven/gotoguy-blog"
  dateFormat = "2006-01-02"
  title = "GoToGuy Blog"
  description = "Thoughts, tutorials, and notes on cloud, security, Azure, GitHub, and developer productivity."

  [params.header]
    desktopMode = "fixed"
    mobileMode = "auto"
    [params.header.title]
      name = "GoToGuy Blog"
      typeit = false

  [params.footer]
    enable = true
    hugo = true
    copyright = true
    author = true
    since = 2026

  [params.home]
    rss = 10
    [params.home.profile]
      enable = true
      avatarURL = "https://avatars.githubusercontent.com/u/13981640?v=4"
      title = "Jan Vidar Elven"
      subtitle = "Microsoft MVP Security, Cloud and Datacenter Architect"
      typeit = false
      social = true
    [params.home.posts]
      enable = true
      paginate = 6

  [params.social]
    GitHub = "JanVidarElven"
    Linkedin = "janvidarelven"
    RSS = true
    [params.social.X]
      weight = 3
      url = "https://x.com/JanVidarElven"
      title = "X"
      newtab = true
      [params.social.X.icon]
        src = "https://cdn.jsdelivr.net/npm/simple-icons@14.16.0/icons/x.svg"
    [params.social.Bluesky]
      weight = 4
      url = "https://bsky.app/profile/jan.vidar.elven.no"
      title = "Bluesky"
      newtab = true
      [params.social.Bluesky.icon]
        src = "https://cdn.jsdelivr.net/npm/simple-icons@14.16.0/icons/bluesky.svg"

  [params.analytics]
    enable = true
    [params.analytics.google]
      id = ""
      anonymizeIP = true
    [params.analytics.umami]
      enable = true
      websiteID = ""
      scriptURL = "https://cloud.umami.is/script.js"

  [params.page]
    hiddenFromHomePage = false
    hiddenFromSearch = false
    linkToMarkdown = true
    rssFullText = false
    [params.page.share]
      enable = true
      Twitter = true
      Facebook = true
      Linkedin = true
      Whatsapp = false
      Viber = false
      Pinterest = false
      Tumblr = false
      Hackernews = false
      Reddit = false
      VK = false
      Buffer = false
      Xing = false
      Line = false
      Instapaper = false
      Pocket = false
      Flipboard = false
      Weibo = false
      Blogger = false
      Baidu = false
      Odnoklassniki = false
      Evernote = false
      Skype = false
      Trello = false
      Mix = false

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = true
    lineNumbersInTable = true
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
  section = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5
